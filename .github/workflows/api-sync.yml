name: Frontend Type Sync

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  type-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: pnpm build
        run: pnpm run build

      - name: Generate API types
        env:
          OPENAPI_URL: ${{ secrets.OPENAPI_URL }}
        run: |
          if [ -z "$OPENAPI_URL" ]; then
            echo "OPENAPI_URL secret is not available (e.g. PR from a fork). Skipping type generation."
            exit 0
          fi
          pnpm exec openapi-typescript "$OPENAPI_URL" -o src/shared/types/api/schemas/api.types.ts
          echo "TYPES_GENERATED=true" >> "$GITHUB_ENV"

      - name: Type check
        run: pnpm run typecheck

      - name: Check for generated file changes
        if: env.TYPES_GENERATED == 'true'
        run: |
          git diff --exit-code src/shared/types/api/schemas/api.types.ts
